<html lang="id">

:root{
  --bg:#1a56db; /* Diubah menjadi biru terang */
  --panel:#1e429f; /* Panel warna biru agar serasi */
  --gold:#facc15;
  --gold2:#fef08a;
  --text:#ffffff;
  --muted:#bfdbfe;
  --border:rgba(250,204,21,.3);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
button,input{font:inherit}
header{
  background:linear-gradient(135deg,#1e429f,#172554);
  border-bottom:1px solid var(--border);
  padding:18px 14px;
}
.header-inner{
  max-width:1150px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:43px;height:43px;
  border-radius:12px;
  background:linear-gradient(135deg,var(--gold2),#ca8a04);
  color:#111;
  display:grid;
  place-items:center;
  font-size:22px;
  font-weight:900;
}
.brand h1{margin:0;font-size:21px;letter-spacing:1px}
.brand small{color:var(--gold);font-size:10px;letter-spacing:2px}
.header-label{
  color:var(--gold2);
  border:1px solid var(--border);
  padding:7px 11px;
  border-radius:20px;
  font-size:11px;
}
.container{
  max-width:1150px;
  margin:auto;
  padding:18px 14px 35px;
}

/* PLAYER DI ATAS */
.player-section{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:15px;
  padding:13px;
  margin-bottom:20px;
  scroll-margin-top:10px;
}
.player-heading{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  margin-bottom:12px;
}
.player-heading h2{
  margin:0;
  font-size:16px;
  color:var(--gold2);
}
.player-heading span{font-size:10px;color:var(--muted)}
.player-frame{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  border-radius:10px;
  overflow:hidden;
}
.player-frame iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
}
.player-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}
.action-btn{
  flex:1;
  min-width:100px;
  border:1px solid var(--border);
  background:#172554;
  color:var(--gold2);
  padding:11px 9px;
  border-radius:8px;
  cursor:pointer;
  font-size:12px;
}
.action-btn.primary{
  background:var(--gold);
  color:#111;
  font-weight:bold;
}
.notice{
  color:var(--muted);
  font-size:11px;
  line-height:1.6;
  margin-top:12px;
}

/* HERO */
.hero{
  background:linear-gradient(120deg,#1d4ed8,#1e40af 65%,#172554);
  border:1px solid var(--border);
  border-radius:17px;
  padding:22px 18px;
  margin-bottom:20px;
}
.hero h2{margin:0 0 8px;font-size:23px;color:var(--gold2)}
.hero p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
